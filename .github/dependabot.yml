version: 2
updates:
  # NPM dependencies — weekly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10
    reviewers:
      - "phirawits"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "deps"
    groups:
      radars:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        patterns:
          - "@vitest/*"
          - "vitest"
          - "playwright"
          - "eslint"
          - "prettier"
          - "typescript"
        update-types:
          - "patch"

  # GitHub Actions — weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
