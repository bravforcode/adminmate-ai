name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Supabase CLI
        run: npm i -g supabase

      - name: Link to Supabase project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy all functions
        run: |
          for fn in supabase/functions/*/; do
            fn_name=$(basename "$fn")
            if [ "$fn_name" != "_shared" ] && [ "$fn_name" != ".temp" ]; then
              echo "Deploying $fn_name..."
              supabase functions deploy "$fn_name" --no-verify-jwt
            fi
          done
